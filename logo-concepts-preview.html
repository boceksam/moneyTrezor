<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Monetra Logo Concepts</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #07110e;
      --panel: #10201b;
      --border: rgba(255,255,255,0.08);
      --text: #f6f8f7;
      --muted: rgba(246,248,247,0.68);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", Arial, sans-serif;
      background:
        radial-gradient(circle at top right, rgba(212,184,107,0.16), transparent 20%),
        radial-gradient(circle at bottom left, rgba(68,197,143,0.12), transparent 18%),
        linear-gradient(180deg, #0c1714, var(--bg));
      color: var(--text);
    }
    main {
      width: min(1200px, calc(100% - 40px));
      margin: 0 auto;
      padding: 32px 0 48px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: clamp(2rem, 4vw, 3.2rem);
      letter-spacing: -0.04em;
    }
    p {
      margin: 0 0 24px;
      color: var(--muted);
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 18px;
    }
    .card {
      padding: 18px;
      border-radius: 26px;
      background: linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.02));
      border: 1px solid var(--border);
      box-shadow: 0 18px 34px rgba(0,0,0,0.2);
    }
    img {
      width: 100%;
      display: block;
      border-radius: 20px;
      background: rgba(255,255,255,0.02);
    }
    h2 {
      margin: 14px 0 6px;
      font-size: 1rem;
    }
    .tag {
      color: #e6d5a0;
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      font-weight: 800;
    }
  </style>
</head>
<body>
  <main>
    <h1>Monetra Logo Concepts</h1>
    <p>Pet odlisnych smeru pro vyber dalsiho rozvoje.</p>
    <section class="grid">
      <article class="card">
        <img src="logo-concept-1-monogram.svg" alt="Monogram logo" />
        <h2>1. Monogram Luxus</h2>
        <div class="tag">M + premium znak</div>
      </article>
      <article class="card">
        <img src="logo-concept-2-vault.svg" alt="Vault logo" />
        <h2>2. Trezor Symbol</h2>
        <div class="tag">Bezpeci + finance</div>
      </article>
      <article class="card">
        <img src="logo-concept-3-coin-growth.svg" alt="Coin growth logo" />
        <h2>3. Mince a Rust</h2>
        <div class="tag">Fintech + investicni styl</div>
      </article>
      <article class="card">
        <img src="logo-concept-4-wallet.svg" alt="Wallet logo" />
        <h2>4. Karta a Penezenka</h2>
        <div class="tag">Digitalni app styl</div>
      </article>
      <article class="card">
        <img src="logo-concept-5-crest.svg" alt="Crest logo" />
        <h2>5. Heraldicky Znak</h2>
        <div class="tag">Private banking vibe</div>
      </article>
    </section>
  </main>
</body>
</html>
